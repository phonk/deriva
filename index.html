.play[aria-pressed="true"] .ic-stop{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  const bedG=ctx.createGain(); bedG.gain.value=.05;
  bed.connect(bedF).connect(bedG).connect(lp); bed.start();
  boxes.forEach((b,i)=>{ b.out=ctx.createGain(); b.out.gain.value=b.muted?0:b.vol*b.vol; b.swell=ctx.createGain(); b.out.connect(b.swell).connect(bus); setSwell(b,i); });
  clearInterval(evolveTimer); evolveTimer=setInterval(evolve,4000);
  applyAge();
}
function applyAge(){
  if(!ctx) return;
  const e=state.age, t=ctx.currentTime, k=e*7, c=new Float32Array(1024);
  for(let i=0;i<1024;i++){ const x=i/511.5-1; c[i]=k<.01?x:Math.tanh(k*x)/Math.tanh(k); }
  shaper.curve=c;
  hp.frequency.setTargetAtTime(30+e*330,t,.1);
  lp.frequency.setTargetAtTime(4200*Math.pow(1700/4200,e),t,.1);
  peak.gain.setTargetAtTime(e*7,t,.1);
  wowG.gain.setTargetAtTime(e*28,t,.1);
  flutG.gain.setTargetAtTime(e*7,t,.1);
  hissG.gain.setTargetAtTime(.006+e*.02,t,.1);
}
async function getBuf(id){
  if(bufs.has(id)) return bufs.get(id);
  const p=fetch("suoni/"+id+".wav").then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(a=>ctx.decodeAudioData(a));
  bufs.set(id,p);
  try { return await p; } catch(e){ bufs.delete(id); throw e; }
}
function stopVoice(v,fade=.8){
  if(!v) return; const t=ctx.currentTime;
  v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value,t); v.g.gain.linearRampToValueAtTime(0,t+fade);
  try{ v.src.stop(t+fade+.05); }catch(e){}
}
async function playBox(b){
  if(!ctx||!state.on) return;
  const id=b.id;
  let buf; try{ buf=await getBuf(id); } catch(err){ return; }
  if(b.id!==id||!state.on) return;
  startVoice(b,buf,ctx.currentTime+.02);
}
function startVoice(b,buf,at,fadeIn=.25,fadeOut=.8){
  const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
  src.playbackRate.value=rateFor(byId[b.id],b);
  wowG.connect(src.detune); flutG.connect(src.detune);
  const g=ctx.createGain(); g.gain.value=0; src.connect(g).connect(b.out);
  src.start(at,0);
  g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(1,at+fadeIn);
  stopVoice(b.voice,fadeOut);
  b.voice={src,g,buf,id:b.id,at}; b.phase=0;
}
/* tutti insieme dal porto: si caricano i suoni, poi partono nello stesso istante */
async function playAll(){
  if(!ctx||!state.on) return;
  const ids=boxes.map(b=>b.id);
  let bs; try{ bs=await Promise.all(ids.map(getBuf)); } catch(err){ boxes.forEach(b=>playBox(b)); return; }
  if(!state.on||boxes.some((b,i)=>b.id!==ids[i])) return;
  const at=ctx.currentTime+.08;
  boxes.forEach((b,i)=>startVoice(b,bs[i],at));
}
function setVol(b){ if(b.out) b.out.gain.setTargetAtTime(b.muted?0:b.vol*b.vol,ctx.currentTime,.1); }


/* respiro: ogni scatola sale e scende di volume con un suo LFO lentissimo, sfasato dagli altri */
const SWELL=[{P:83,min:.4},{P:61,min:.12},{P:47,min:.15},{P:71,min:.25},{P:37,min:.05}];
function setSwell(b,i){
  const s=SWELL[i], P=s.P*rnd(.85,1.15), phi=Math.random()*Math.PI*2;
  const c=(1+s.min)/2, d=(1-s.min)/2, t=ctx.currentTime;
  const wave=ctx.createPeriodicWave(new Float32Array([0,Math.sin(phi)]),new Float32Array([0,Math.cos(phi)]),{disableNormalization:true});
  const osc=ctx.createOscillator(); osc.setPeriodicWave(wave); osc.frequency.value=1/P;
  const dg=ctx.createGain(); dg.gain.value=d;
  b.swell.gain.cancelScheduledValues(t); b.swell.gain.setValueAtTime(c,t);
  osc.connect(dg).connect(b.swell.gain); osc.start(t);
  if(b.lfo){ const old=b.lfo; old.dg.gain.setTargetAtTime(0,t,2); setTimeout(()=>{ try{old.osc.stop()}catch(e){} },12000); }
  b.lfo={osc,dg,P,phi,c,d,t0:t};
}
function swellNow(b){
  if(!ctx||!b.lfo) return 1;
  const L=b.lfo; return L.c+L.d*Math.sin(2*Math.PI*(ctx.currentTime-L.t0)/L.P+L.phi);
}
/* evoluzione: ogni due o tre minuti una scatola cambia suono, quando sta respirando piano;
   ogni tanto l'ospite entra o esce, e l'eta' del suono si sposta di poco */
let nextEvolve=null;
function evolve(){
  if(!ctx||!state.on) { nextEvolve=null; return; }
  const now=ctx.currentTime;
  if(nextEvolve===null){ nextEvolve=now+rnd(90,150); return; }
  if(now<nextEvolve) return;
  nextEvolve=now+rnd(100,190);
  state.age=Math.min(.5,Math.max(.1,state.age+rnd(-.06,.06))); applyAge();
  const guest=boxes[4];
  if(Math.random()<.3){ guest.muted=!guest.muted; guest.out.gain.setTargetAtTime(guest.muted?0:guest.vol*guest.vol,now,4); return; }
  const live=boxes.filter(b=>!b.muted);
  const b=live.reduce((a,x)=>swellNow(x)<swellNow(a)?x:a,live[0]);
  const taken=new Set(boxes.map(x=>x.id)); pickFor(b,taken);
  const id=b.id;
  getBuf(id).then(buf=>{ if(b.id===id&&state.on) startVoice(b,buf,ctx.currentTime+.05,10,10); }).catch(()=>{});
}

/* risposta all'impulso sintetica: rumore che decade, sempre piu' scuro col passare del tempo */
function makeIR(sec){
  const sr=ctx.sampleRate, n=Math.floor(sec*sr), ir=ctx.createBuffer(2,n,sr);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch); let y=0;
    for(let i=0;i<n;i++){
      const t=i/sr, a=0.55*Math.exp(-t/1.1)+0.03;
      y+=a*((Math.random()*2-1)-y);
      d[i]=y*Math.exp(-t/1.05)*(t<0.012?t/0.012:1);
    }
  }
  return ir;
}
/* rumore marrone: il soffio grave di un nastro o di una stanza */
function brownNoise(sec){
  const n=Math.floor(sec*ctx.sampleRate), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0); let y=0;
  for(let i=0;i<n;i++){ y=(y+0.02*(Math.random()*2-1))/1.02; d[i]=y*3.5; }
  const jump=d[n-1]-d[0]; for(let i=0;i<n;i++) d[i]-=jump*i/(n-1);   // fine e inizio coincidono: loop senza scatto
  return b;
}

/* ---------- controls ---------- */
const $=s=>document.querySelector(s);
const NAMES=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const MODE_EN={libero:"",minore:"minor",dorico:"dorian",lidio:"lydian",misolidio:"mixolydian",penta:"major pentatonic",pentam:"minor pentatonic"};
const stage=$("#stage");
NAMES.forEach((n,i)=>{
  const b=document.createElement("button"); b.className="note"; b.id="n"+i; b.textContent=n;
  b.setAttribute("aria-label","Key of "+n);
  const a=-Math.PI/2+i*Math.PI/6;
  b.style.left=(50+Math.cos(a)*44)+"%"; b.style.top=(50+Math.sin(a)*44)+"%";
  b.onclick=()=>setTonic(i);
  stage.append(b);
});
function showKey(){
  document.querySelectorAll(".note").forEach((x,j)=>x.setAttribute("aria-pressed",j===state.tonic));
  $("#nowA").textContent=NAMES[state.tonic].toLowerCase();
  $("#nowB").textContent=MODE_EN[state.mode]||"free";
}
function setTonic(i){
  state.tonic=i;
  const taken=new Set(boxes.map(b=>b.id));
  boxes.forEach(b=>{
    if(!compatible(byId[b.id])){ taken.delete(b.id); pickFor(b,taken); taken.add(b.id); playBox(b); }
    else if(b.voice) b.voice.src.playbackRate.setTargetAtTime(rateFor(byId[b.voice.id],b),ctx.currentTime,.15);
  });
  showKey();
}
function gira(){
  state.mode=pickOne(MODE_BAG);
  state.age=Math.round(rnd(.15,.45)*100)/100;
  const taken=new Set();
  boxes.forEach(b=>{
    pickFor(b,taken); taken.add(b.id);
    b.vol=rnd(...b.role.vol);
    b.muted=!!b.role.off&&Math.random()<b.role.off;
    setVol(b);
    if(ctx&&b.swell) setSwell(b,boxes.indexOf(b));
  });
  playAll(); applyAge(); showKey();
  const g=$("#gira"); g.classList.add("spun"); setTimeout(()=>g.classList.remove("spun"),400);
}
gira();
$("#gira").onclick=gira;
/* ---------- waking the audio after a screen lock ----------
   phones can leave the audio context stuck after the screen goes off: resume() never answers and play stays dead until a reload.
   So we try to resume for a moment, and if it doesn't come back we throw the context away and build a fresh one. */
const resumeSoon=(c,ms)=>Promise.race([c.resume().then(()=>true,()=>false),new Promise(r=>setTimeout(()=>r(false),ms))]);
async function wakeCtx(){
  if(!ctx) initAudio();
  if(ctx.state==="running") return true;
  if(ctx.state!=="closed" && await resumeSoon(ctx,400) && ctx.state==="running") return true;
  boxes.forEach(b=>{ b.voice=null; });
  const old=ctx; ctx=null; old.close().catch(()=>{}); initAudio();
  await resumeSoon(ctx,800); return ctx.state==="running";
}
/* a silent media element keeps the audio session alive on phones, so deriva goes on with the screen off */
const au=new Audio(); au.loop=true; au.setAttribute("playsinline","");
au.src=(()=>{const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b);let o=0;
  const s=t=>{for(let i=0;i<t.length;i++)v.setUint8(o++,t.charCodeAt(i))},u32=x=>{v.setUint32(o,x,true);o+=4},u16=x=>{v.setUint16(o,x,true);o+=2};
  s("RIFF");u32(36+n*2);s("WAVE");s("fmt ");u32(16);u16(1);u16(1);u32(44100);u32(88200);u16(2);u16(16);s("data");u32(n*2);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))})();
function setOn(on){
  state.on=on;
  $("#play").setAttribute("aria-pressed",on); $("#play").setAttribute("aria-label",on?"Stop":"Play");
  if(on){ au.volume=.01; au.play().catch(()=>{}); } else au.pause();
  try{ navigator.mediaSession.playbackState=on?"playing":"paused"; }catch(e){}
}
async function toggle(){
  if(state.on){ setOn(false); boxes.forEach(b=>{ stopVoice(b.voice,1); b.voice=null; }); return; }
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  if(!await wakeCtx()) return;
  setOn(true); playAll();
  if("mediaSession" in navigator){ try{
    navigator.mediaSession.metadata=new MediaMetadata({title:"deriva",artist:"suoni che si perdono"});
    navigator.mediaSession.setActionHandler("play",()=>{ if(!state.on) toggle(); });
    navigator.mediaSession.setActionHandler("pause",()=>{ if(state.on) toggle(); });
    navigator.mediaSession.setActionHandler("stop",()=>{ if(state.on) toggle(); });
  }catch(e){} }
}
/* back from a locked screen: if the sound came back, carry on; if it's stuck, show play again so one tap rebuilds it */
async function onReturn(){
  if(document.hidden||!state.on||!ctx||ctx.state==="running") return;
  if(await resumeSoon(ctx,400) && ctx.state==="running") return;
  setOn(false); boxes.forEach(b=>{ b.voice=null; });
}
document.addEventListener("visibilitychange",onReturn); addEventListener("pageshow",onReturn); addEventListener("focus",onReturn);
$("#play").onclick=toggle;
$("#cv").onclick=toggle;

/* ---------- the rings ---------- */
const cv=$("#cv"), c2=cv.getContext("2d");
function size(){ const r=cv.getBoundingClientRect(), d=devicePixelRatio||1; cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); }
addEventListener("resize",size); size();
const RAD=[0.37,0.32,0.27,0.22,0.17];
let last=performance.now();
function draw(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  const W=cv.width,H=cv.height,cs=getComputedStyle(document.documentElement),C=k=>cs.getPropertyValue(k).trim();
  const ink=C("--ink"),mute=C("--mute"),line=C("--line"),amber=C("--amber"),wine=C("--wine");
  const cx=W/2,cy=H/2,U=Math.min(W,H),dpr=devicePixelRatio||1, on=state.on;
  c2.clearRect(0,0,W,H);
  // rim: twelve ticks, the key marked in wine
  for(let j=0;j<12;j++){ const th=-Math.PI/2+j*Math.PI/6, R=U*0.41;
    c2.beginPath(); c2.arc(cx+Math.cos(th)*R,cy+Math.sin(th)*R,(j===state.tonic?2.6:1.4)*dpr,0,7);
    c2.fillStyle=j===state.tonic?wine:line; c2.fill(); }
  boxes.forEach((b,i)=>{
    if(b.voice&&on&&ctx.currentTime>=b.voice.at) b.phase=(b.phase+dt*b.voice.src.playbackRate.value/b.voice.buf.duration)%1;
    const r=U*RAD[i], live=on&&!b.muted, sw=on?swellNow(b):1;
    c2.strokeStyle=live?ink:line; c2.globalAlpha=live?0.12+0.7*b.vol*sw:1; c2.lineWidth=(i===0?1.6:1)*dpr;
    c2.setLineDash(b.muted?[2*dpr,5*dpr]:[]);
    c2.beginPath(); c2.arc(cx,cy,r,0,7); c2.stroke(); c2.setLineDash([]); c2.globalAlpha=1;
    if(b.muted) return;
    const a=-Math.PI/2+b.phase*Math.PI*2, len=(0.35+0.8*b.vol)*(on?0.3+0.7*sw:1);
    c2.strokeStyle=on?amber:mute; c2.globalAlpha=on?1:.35; c2.lineWidth=2*dpr; c2.lineCap="round";
    c2.beginPath(); c2.arc(cx,cy,r,a-len,a); c2.stroke(); c2.globalAlpha=1;
  });
  c2.fillStyle=on?ink:mute; c2.textAlign="center"; c2.textBaseline="middle";
  c2.font=`300 ${Math.round(U*0.05)}px ${C("--font")}`; c2.fillText(on?"":"tap",cx,cy);
  if(on){ c2.beginPath(); c2.arc(cx,cy,1.6*dpr,0,7); c2.fillStyle=amber; c2.fill(); }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
